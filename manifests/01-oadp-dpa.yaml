apiVersion: oadp.openshift.io/v1alpha1
kind: DataProtectionApplication
metadata:
  name: oadp-hub1
  namespace: open-cluster-management-backup
spec:
  backupLocations:
    - velero:
        config:
          profile: default
          region: us-east-1
          s3ForcePathStyle: 'false'
        credential:
          key: cloud
          name: cloud-credentials
        default: true
        objectStorage:
          bucket: cloud-front-bucket-jul24
          prefix: velero
        provider: aws
  configuration:
    kopia:
      enable: true
    velero:
      defaultPlugins:
        - openshift
        - aws
        - kubevirt
  snapshotLocations:
    - velero:
        config:
          profile: default
          region: us-east-1
        provider: aws
