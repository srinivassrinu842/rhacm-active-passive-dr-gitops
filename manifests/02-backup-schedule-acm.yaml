apiVersion: cluster.open-cluster-management.io/v1beta1
kind: BackupSchedule
metadata:
  name: schedule-acm
  namespace: open-cluster-management-backup
spec:
  veleroSchedule: 0 */2 * * *   # Backup every 2 hours
  veleroTtl: 12h                # Retain for 12 hours
  useManagedServiceAccount: true # Automatically reconnects imported spoke clusters upon restore
