apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-applications
  namespace: openshift-gitops
spec:
  generators:
    # Uses RHACM Placement generator for Active-Passive GitOps Failover
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: workload-placement
        requeueAfterSeconds: 30
  template:
    metadata:
      name: '{{name}}-bgd'
    spec:
      project: default
      source:
        # Red Hat Official OpenShift-Native Sample App (Runs non-root on port 8080)
        repoURL: https://github.com/openshift-gitops-samples/bgd-app.git
        targetRevision: main
        path: .
      destination:
        namespace: bgd
        server: '{{server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
